name: Python quality

on:
  push:
  pull_request:

jobs:
  ml-engine:
    name: ML engine checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ML package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./ml_engine[dev]"
          python -m pip install build

      - name: Check imports and bundled dataset
        run: |
          python -c "import mockmate_ml"
          python -c "from mockmate_ml.data.loader import load_default_dataset; assert len(load_default_dataset().questions) >= 20"
          python -c "from mockmate_ml.retrieval.engine import QuestionRetriever"

      - name: Run ML tests
        run: python -m pytest ml_engine/tests -v

      - name: Ruff lint
        run: ruff check ml_engine/src ml_engine/tests

      - name: Ruff format
        run: ruff format --check ml_engine/src ml_engine/tests

      - name: Build distributable package
        run: python -m build ml_engine

  backend-integration:
    name: Backend to ML integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend and ML dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -e ./ml_engine
          python -m pip install pytest

      - name: Run backend tests
        env:
          PYTHONPATH: ml_engine/src:backend
          SECRET_KEY: mockmate-ci-only-secret-key-do-not-use-in-production
        run: python -m pytest backend/tests -v
