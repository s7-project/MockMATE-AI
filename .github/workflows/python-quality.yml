name: Python quality

on:
  push:
  pull_request:

jobs:
  ml-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -e "./ml_engine[dev]"
      - run: python -m pytest ml_engine/tests -v
      - run: ruff check ml_engine/src ml_engine/tests
      - run: ruff format --check ml_engine/src ml_engine/tests
